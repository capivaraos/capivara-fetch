# Flatpak manifest for Flathub.
#
# Python + PyGObject (GTK4/libadwaita/pycairo all ship in the GNOME runtime)
# plus gtk4-layer-shell, bundled so the optional "pin to desktop" widget can
# anchor to the background where the compositor supports layer-shell.
#
# For local testing:
#   flatpak-builder --user --install --force-clean build-dir \
#       build-aux/flatpak/org.capivaraos.Fetch.yml
#
# For Flathub submission, replace the `dir` source with a tagged git source.
id: org.capivaraos.Fetch
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: capivara-fetch

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Let the user save the shared card into Downloads.
  - --filesystem=xdg-download
  # Read-only host access so hardware probes (lspci, /sys) work in the sandbox.
  - --filesystem=host:ro

modules:
  - name: gtk4-layer-shell
    buildsystem: meson
    config-opts:
      - -Dexamples=false
      - -Ddocs=false
      - -Dtests=false
    sources:
      - type: git
        url: https://github.com/wmww/gtk4-layer-shell.git
        tag: v1.3.0
        commit: 1c963c51514581c41b9bdae08cdf69171265cdda

  - name: capivara-fetch
    buildsystem: meson
    sources:
      # Local build. For Flathub swap for:
      #   - type: git
      #     url: https://github.com/capivaraos/capivara-fetch.git
      #     tag: v0.1.0
      - type: dir
        path: ../..
