<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  
  <rect x="0" y="0" width="512" height="512" rx="112" fill="#16233d"/>
  <!-- ears: small, tucked to the top corners (capybara has tiny ears) -->
  <ellipse cx="150" cy="182" rx="27" ry="23" fill="#a06a3f"/>
  <ellipse cx="362" cy="182" rx="27" ry="23" fill="#a06a3f"/>
  <ellipse cx="151" cy="186" rx="12" ry="11" fill="#7c4e30"/>
  <ellipse cx="361" cy="186" rx="12" ry="11" fill="#7c4e30"/>
  <!-- head: blockier, flatter top, elongated toward the snout -->
  <rect x="112" y="170" width="288" height="292" rx="66" ry="72" fill="#cca878"/>
  <!-- broad blunt muzzle (lower half of the face) -->
  <rect x="150" y="322" width="212" height="150" rx="80" fill="#d9b78f"/>
  <!-- eyes: smaller, set high and wide -->
  <circle cx="190" cy="252" r="18" fill="#20160f"/>
  <circle cx="322" cy="252" r="18" fill="#20160f"/>
  <circle cx="197" cy="245" r="5.5" fill="#ffffff" opacity="0.92"/>
  <circle cx="329" cy="245" r="5.5" fill="#ffffff" opacity="0.92"/>
  <!-- big rectangular nose pad (the capybara signature) -->
  <rect x="184" y="318" width="144" height="104" rx="34" fill="#3a2b22"/>
  <ellipse cx="228" cy="360" rx="12" ry="18" fill="#0f0b08"/>
  <ellipse cx="284" cy="360" rx="12" ry="18" fill="#0f0b08"/>
  <!-- mouth -->
  <path d="M226 416 Q256 438 286 416" stroke="#5a4331" stroke-width="7" fill="none" stroke-linecap="round"/>
</svg>